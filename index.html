<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width"/>
        <title>Pixel Drawing App</title>

        <link rel="stylesheet" href="styles.css">
        <script src="https://code.jquery.com"></script>


    </head>
    <body>
        <div id="info">
        <h1>Pixel Drawer</h1>
        <h2>Create pixel art!</h2>
        <br>
        <p2>
            E: Swap Pencil / Eraser   
            <br>
            Z: Undo 
            <br>
            R: Redo
            <br>
            H: Horizontal Line
            <br>
            V: Vertical Line
            <br>
            N: Left Diagonal 
            <br>
            M: Right Diagonal 

        </p2>
        </div>

        </div>
        <div class="navigation">
            <p1>Canva Size</p1><input type="number" value="16" class="size" name="size">
            <p1>Color</p1><input type="color" class= "pen-color" name="pen-color">
            <p1>Background</p1><input type="color" value="#FFFFFF" class="bkgd-color" name="bkgd-color">
            <p1>Brush Size</p1><select class="brush-size" name="brush-size">
                <option value ="small">Small</option>
                <option value ="med">Medium</option>
                <option value ="large">Large</option>
                <!-- <option value ="1px">1px</option> -->
                <!-- <option value ="1px">1px</option> -->
            </select>

            <button class="reset">Clear Canvas</button>
            <button class="grid">Grid (On/Off)</button>
        </div>


        <div id="container" class="container">
          
        </div>


        <div id="panel">
            <div id="pal" class="pal1"><button id="col" class="col1"></button></div>
            <div id="pal" class="pal2"><button id="col" class="col2"></button></div>
            <div id="pal" class="pal3"><button id="col" class="col3"></button></div>
            <div id="pal" class="pal4"><button id="col" class="col4"></button></div>
            <div id="pal" class="pal5"><button id="col" class="col5"></button></div>
            <div id="pal" class="pal6"><button id="col" class="col6"></button></div>
            <div id="pal" class="pal7"><button id="col" class="col7"></button></div>
            <div id="pal" class="pal8"><button id="col" class="col8"></button></div>
            <div id="pal" class="pal9"><button id="col" class="col9"></button></div>
            </div>
        </div>
        <br>
        <button id="empty" class="emp1"></button>
        <button id="empty" class="emp2"></button>
        <button id="empty" class="emp3"></button>
        <button id="empty" class="emp4"></button>
        <button id="empty" class="emp5"></button>
        <button id="empty" class="emp6"></button>
        <button id="empty" class="emp7"></button>
        <button id="empty" class="emp8"></button>
        <button id="empty" class="emp9"></button>
<br>
      
            <div id= "bottom-buttons">
            <button class="export">Export Palette</button>
            <button class="background">Background (On/Off)</button>
            <button class="save">Save</button>

            </div>

      

               <div id="showcase" ></div>


        
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
        <script src="http://cdn.jsdelivr.net/g/filesaver.js"></script>

       

        <script src="main.js"></script>

            $(document).ready(function(){
                $(".save").click(function(){
                    domtoimage.toBlob(document.getElementById('container'))
                    .then(function(blob){
                        window.saveAs(blob, "pixelArt.png")
                    })
                })

            })
           
            $(".export").click(function(){
                domtoimage.toBlob(document.getElementById('panel'))
                .then(function(blob){
                    window.saveAs(blob, "palette.png")
                })

            })
