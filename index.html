        <div id="info">
        <h1>Pixel Drawer</h1>
        <h2>Create pixel art!</h2>
        </div>
        <p1><strong>E:</strong> Pencil / Eraser&nbsp;&nbsp;<strong>Z:</strong> Undo&nbsp;&nbsp;<strong>R:</strong> Redo</p1>


        </div>
        <div class="navigation">
            <p1>Canva Size</p1><input type="number" value="16" class="size" name="size">
            <p1>Color</p1><input type="color" class= "pen-color" name="pen-color">
            <p1>Background</p1><input type="color" value="#FFFFFF" class="bkgd-color" name="bkgd-color">

            <div id="pal" class="pal3"><button id="empty" class="emp3"></button><button id="col" class="col3"></button></div>

        </div>

                $(".save").click(function(){
                    domtoimage.toBlob(document.getElementById('container'))
